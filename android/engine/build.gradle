plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.appcompat.engine"
    compileSdk 36
    ndkVersion "29.0.13846066"

    defaultConfig {
        minSdk 24
        // The helper is the real Android UID/package behind virtual guests. Android
        // applies many compatibility decisions to this targetSdk, not to the guest
        // manifest BlackBox exposes in-process. API 25 is intentionally the newest
        // pre-Oreo profile: it stays below the API-26 behavior gate while remaining
        // installable on current Android 14-16 devices. Removed APIs are translated
        // separately at Binder, Settings, permission and WindowManager boundaries.
        targetSdk 25
        versionCode 11
        versionName "0.11.0"
        multiDexEnabled true
        buildConfigField "int", "COMPAT_PROFILE_TARGET_SDK", "25"
    }

    flavorDimensions += "runtime"
    productFlavors {
        arm32 {
            dimension "runtime"
            applicationId "com.appcompat.runtime.engine32.v11"
            ndk {
                abiFilters "armeabi-v7a"
            }
            buildConfigField "int", "ENGINE_BITS", "32"
        }
        arm64 {
            dimension "runtime"
            applicationId "com.appcompat.runtime.engine64.v11"
            ndk {
                abiFilters "arm64-v8a"
            }
            buildConfigField "int", "ENGINE_BITS", "64"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*"
            ]
        }
    }

    lint {
        disable += ["ExpiredTargetSdkVersion"]
        abortOnError true
        checkReleaseBuilds true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation project(":Bcore")
    implementation "androidx.multidex:multidex:2.0.1"
}
