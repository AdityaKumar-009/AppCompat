plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.appcompat.engine"
    compileSdk 36
    ndkVersion "29.0.13846066"

    defaultConfig {
        minSdk 24
        // The helper is the real Android UID/package behind virtual guests. Android
        // applies many compatibility decisions to this targetSdk, not to the guest
        // manifest BlackBox exposes in-process. API 25 is intentionally the newest
        // pre-Oreo profile. v13 uses structural dexlib2 rewriting so guest bytecode
        // sees the API-25 Build.VERSION shim without corrupting DEX identifier order.
        targetSdk 25
        versionCode 13
        versionName "0.13.0"
        multiDexEnabled true
        buildConfigField "int", "COMPAT_PROFILE_TARGET_SDK", "25"
        manifestPlaceholders = [
            engineAppLabel: "AppCompat Legacy Runtime v13",
            notificationAccessLabel: "AppCompat Runtime v13 notification access",
            accessibilityLabel: "AppCompat Runtime v13 accessibility bridge",
            deviceAdminLabel: "AppCompat Runtime v13 device administrator"
        ]
    }

    // `runtime` selects the CPU ABI. `guest` optionally gives a legacy app its own
    // real Android permission principal. Android 11+ intentionally forces overlay
    // requests to a top-level app list, so a Floatify-specific helper is labeled
    // "Floatify" there instead of asking users to guess among AppCompat runtimes.
    flavorDimensions += ["runtime", "guest"]
    productFlavors {
        arm32 {
            dimension "runtime"
            applicationId "com.appcompat.runtime.engine32.v13"
            applicationIdSuffix ".r3"
            ndk {
                abiFilters "armeabi-v7a"
            }
            buildConfigField "int", "ENGINE_BITS", "32"
        }
        arm64 {
            dimension "runtime"
            applicationId "com.appcompat.runtime.engine64.v13"
            applicationIdSuffix ".r3"
            ndk {
                abiFilters "arm64-v8a"
            }
            buildConfigField "int", "ENGINE_BITS", "64"
        }

        generic {
            dimension "guest"
        }
        floatify {
            dimension "guest"
            // Separate real package/UID means Android's overlay + notification-access
            // screens can identify the permission principal by the guest's name.
            applicationIdSuffix ".floatify"
            manifestPlaceholders = [
                engineAppLabel: "Floatify",
                notificationAccessLabel: "Floatify",
                accessibilityLabel: "Floatify accessibility bridge",
                deviceAdminLabel: "Floatify device administrator"
            ]
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*"
            ]
        }
    }

    lint {
        disable += ["ExpiredTargetSdkVersion"]
        abortOnError true
        checkReleaseBuilds true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation project(":Bcore")
    implementation "androidx.multidex:multidex:2.0.1"
}
