plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.appcompat.engine"
    compileSdk 36
    ndkVersion "29.0.13846066"

    defaultConfig {
        minSdk 24
        targetSdk 33
        versionCode 4
        versionName "0.4.0"
        multiDexEnabled true
    }

    flavorDimensions += "runtime"
    productFlavors {
        arm32 {
            dimension "runtime"
            applicationId "com.appcompat.runtime.engine32"
            ndk {
                abiFilters "armeabi-v7a"
            }
            buildConfigField "int", "ENGINE_BITS", "32"
        }
        arm64 {
            dimension "runtime"
            applicationId "com.appcompat.runtime.engine64"
            ndk {
                abiFilters "arm64-v8a"
            }
            buildConfigField "int", "ENGINE_BITS", "64"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*"
            ]
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Reflection and Binder hook entry points are intentionally preserved.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation project(":Bcore")
    implementation "androidx.multidex:multidex:2.0.1"
}
