plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.appcompat.engine"
    compileSdk 36
    ndkVersion "29.0.13846066"

    defaultConfig {
        minSdk 24
        // The helper is sideloaded from the signed AppCompat host, not Play-listed.
        // Keeping its target at 28 preserves legacy framework semantics for the
        // Binder/reflection compatibility engine while remaining installable on
        // Android 14/15/16 (whose documented low-target install floor is below 28).
        targetSdk 28
        versionCode 6
        versionName "0.6.0"
        multiDexEnabled true
    }

    flavorDimensions += "runtime"
    productFlavors {
        arm32 {
            dimension "runtime"
            applicationId "com.appcompat.runtime.engine32"
            ndk {
                abiFilters "armeabi-v7a"
            }
            buildConfigField "int", "ENGINE_BITS", "32"
        }
        arm64 {
            dimension "runtime"
            applicationId "com.appcompat.runtime.engine64"
            ndk {
                abiFilters "arm64-v8a"
            }
            buildConfigField "int", "ENGINE_BITS", "64"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*"
            ]
        }
    }

    // targetSdk 28 is an intentional runtime-compatibility property of these
    // private helper APKs. They are embedded in AppCompat and provisioned locally;
    // they are not the Play-distributed user-facing application. Keep every other
    // release lint check fatal and suppress only the Play target-SDK policy check.
    lint {
        disable += ["ExpiredTargetSdkVersion"]
        abortOnError true
        checkReleaseBuilds true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Reflection and Binder hook entry points are intentionally preserved.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation project(":Bcore")
    implementation "androidx.multidex:multidex:2.0.1"
}
