plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.appcompat.runtime"
    compileSdk 36
    ndkVersion "29.0.13846066"

    defaultConfig {
        applicationId "com.appcompat.runtime"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "0.6.0"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*"
            ]
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // The visible Flutter host is deliberately UI-only. Guest code runs in a
    // separately ABI-selected runtime process/package provisioned from assets.
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.multidex:multidex:2.0.1"
}
