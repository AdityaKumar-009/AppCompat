name: Build AppCompat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Fetch and patch compatibility engine
        run: bash scripts/fetch_engine.sh

      - name: Verify application bootstrap translation
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="third_party/NewBlackbox/Bcore/src/main/java/top/niunaijun/blackbox/app/BActivityThread.java"
          grep -q 'application = createApplicationWithFallback(applicationInfo);' "$ENGINE"
          grep -q 'application = createMinimalApplication(packageContext, packageName);' "$ENGINE"
          grep -q 'AppInstrumentation.get().newApplication(' "$ENGINE"
          grep -q 'Application.class.getDeclaredMethod("attach", Context.class)' "$ENGINE"
          grep -q 'Guest startup failed at ' "$ENGINE"
          grep -q 'startupStage = "Application.onCreate";' "$ENGINE"
          if grep -q 'application = (Application) packageContext;' "$ENGINE"; then
            echo "Broken Context-to-Application fallback is still present" >&2
            exit 1
          fi
          if grep -q 'Application.class.getDeclaredMethod("attachBaseContext", Context.class)' "$ENGINE"; then
            echo "Broken Application.attachBaseContext reflection is still present" >&2
            exit 1
          fi

      - name: Verify runtime framework translation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="third_party/NewBlackbox/Bcore/src/main/java/top/niunaijun/blackbox"
          ADAPTER="$ROOT/utils/compat/FrameworkTypeAdapter.java"
          BUILD_COMPAT="$ROOT/utils/compat/BuildCompat.java"
          DISPATCHER="$ROOT/fake/hook/ClassInvocationStub.java"

          test -s "$ADAPTER"
          grep -q 'method.getReturnType()' "$ADAPTER"
          grep -q 'ParceledListSliceCompat.isReturnParceledListSlice(method)' "$ADAPTER"
          grep -q 'platform-fallback' "$ADAPTER"
          grep -q 'type-safe-default' "$ADAPTER"
          grep -q 'FrameworkTypeAdapter.adaptReturnValue' "$DISPATCHER"
          grep -q 'FrameworkTypeAdapter.recoverHookFailure' "$DISPATCHER"
          grep -q 'public static boolean isBaklava()' "$BUILD_COMPAT"
          grep -q 'return isAtLeast(36);' "$BUILD_COMPAT"
          grep -q 'public static boolean isV()' "$BUILD_COMPAT"
          grep -q 'return isAtLeast(35);' "$BUILD_COMPAT"
          grep -q 'public static boolean isU()' "$BUILD_COMPAT"
          grep -q 'return isAtLeast(34);' "$BUILD_COMPAT"
          grep -q 'public static boolean isTiramisu()' "$BUILD_COMPAT"
          grep -q 'return isAtLeast(33);' "$BUILD_COMPAT"
          echo "Runtime framework translation verified for Android API 21-36 gates"

      - name: Verify runtime permission translation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="third_party/NewBlackbox/Bcore/src/main/java/top/niunaijun/blackbox"
          PERMISSION_COMPAT="$ROOT/utils/compat/LegacyPermissionCompat.java"
          PM_PROXY="$ROOT/fake/service/IPackageManagerProxy.java"
          AM_PROXY="$ROOT/fake/service/IActivityManagerProxy.java"
          BRIDGE="android/engine/src/main/kotlin/com/appcompat/engine/EngineBridgeActivity.kt"
          RUNTIME="android/engine/src/main/kotlin/com/appcompat/engine/EngineRuntime.kt"
          HOST="android/app/src/main/kotlin/com/appcompat/runtime/MainActivity.kt"

          test -s "$PERMISSION_COMPAT"
          grep -q 'requiredHostRuntimePermissions' "$PERMISSION_COMPAT"
          grep -q 'READ_MEDIA_IMAGES' "$PERMISSION_COMPAT"
          grep -q 'BLUETOOTH_CONNECT' "$PERMISSION_COMPAT"
          grep -q 'checkGuestPermission' "$PERMISSION_COMPAT"
          grep -q 'LegacyPermissionCompat.checkGuestPermission' "$PM_PROXY"
          grep -q 'LegacyPermissionCompat.checkGuestPermission' "$AM_PROXY"
          grep -q 'requestPermissions(missing, REQUEST_GUEST_PERMISSIONS)' "$BRIDGE"
          grep -q 'permissionsDenied' "$BRIDGE"
          grep -q 'requiredHostRuntimePermissions' "$RUNTIME"
          grep -q 'val installed = extras\["installed"\] == true' "$HOST"
          grep -q 'registerPendingGuestIfInstalled(launched, installed)' "$HOST"
          grep -q 'pendingEngineApk?.absolutePath' "$HOST"
          echo "Permission preflight and durable library registration verified"

      - name: Verify special app access translation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="third_party/NewBlackbox/Bcore/src/main/java/top/niunaijun/blackbox"
          SPECIAL="$ROOT/utils/compat/LegacySpecialAccessCompat.java"
          START="$ROOT/fake/service/ActivityManagerCommonProxy.java"
          SETTINGS="$ROOT/fake/service/ISettingsProviderProxy.java"
          NOTIFICATION="$ROOT/fake/service/INotificationManagerProxy.java"
          APPOPS="$ROOT/fake/service/IAppOpsManagerProxy.java"
          SERVICES="$ROOT/app/dispatcher/AppServiceDispatcher.java"
          USAGE="$ROOT/fake/service/IUsageStatsManagerProxy.java"
          MEDIA="$ROOT/fake/service/IMediaSessionManagerProxy.java"
          HOOKS="$ROOT/fake/hook/HookManager.java"
          PROXY="android/engine/src/main/kotlin/com/appcompat/engine/NotificationAccessProxyService.kt"
          MANIFEST="android/engine/src/main/AndroidManifest.xml"

          test -s "$SPECIAL" && test -s "$PROXY" && test -s "$USAGE"
          grep -q 'NOTIFICATION_LISTENER_DETAIL_SETTINGS' "$SPECIAL"
          grep -q 'isSpecialAccessSettingsIntent' "$SPECIAL"
          grep -q 'ensureResolvableSpecialAccessSettingsIntent' "$SPECIAL"
          grep -q 'rewriteSettingsIntent' "$START"
          grep -q '!didRedirectSamsungAccount && !specialAccessSettings' "$START"
          grep -q 'Converting special-access startActivityForResult to safe external launch' "$START"
          grep -q 'translatedSecureString' "$SETTINGS"
          grep -q 'IsNotificationListenerAccessGranted' "$NOTIFICATION"
          grep -q 'isSpecialAccessAppOp' "$APPOPS"
          grep -q 'dispatchSpecialAccessCallback' "$SERVICES"
          grep -q 'replaceAllAppPkg' "$USAGE"
          grep -q 'addInjector(new IUsageStatsManagerProxy())' "$HOOKS"
          grep -q 'NotificationListenerIdentity' "$MEDIA"
          grep -q 'activeNotifications?.toList().orEmpty()' "$PROXY"
          grep -q 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE' "$MANIFEST"
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' "$MANIFEST"
          grep -q 'android.permission.PACKAGE_USAGE_STATS' "$MANIFEST"
          echo "Special app access routing, service attribution, and notification proxy verified"

      - name: Verify host-helper version contract
        shell: bash
        run: |
          set -euo pipefail
          HOST_CODE="$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' android/app/build.gradle | head -n1 | awk '{print $2}')"
          ENGINE_CODE="$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' android/engine/build.gradle | head -n1 | awk '{print $2}')"
          PUBSPEC_CODE="$(awk -F'+' '/^version: / {print $2}' pubspec.yaml)"
          test -n "$HOST_CODE" && test "$HOST_CODE" = "$ENGINE_CODE" && test "$HOST_CODE" = "$PUBSPEC_CODE"
          grep -q 'BuildConfig.VERSION_CODE.toLong()' android/app/src/main/kotlin/com/appcompat/runtime/EngineBroker.kt
          grep -q 'com.appcompat.runtime.engine32.v10' android/app/src/main/kotlin/com/appcompat/runtime/EngineBroker.kt
          grep -q 'com.appcompat.runtime.engine64.v10' android/app/src/main/kotlin/com/appcompat/runtime/EngineBroker.kt
          grep -q 'applicationId "com.appcompat.runtime.engine32.v10"' android/engine/build.gradle
          grep -q 'applicationId "com.appcompat.runtime.engine64.v10"' android/engine/build.gradle
          grep -q 'com.appcompat.runtime.engine32.v10' android/app/src/main/AndroidManifest.xml
          grep -q 'com.appcompat.runtime.engine64.v10' android/app/src/main/AndroidManifest.xml
          echo "Host/helper version contract verified at versionCode=$HOST_CODE"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          rm -rf android/gradle android/gradlew android/gradlew.bat
          cp -R third_party/NewBlackbox/gradle android/gradle
          cp third_party/NewBlackbox/gradlew android/gradlew
          cp third_party/NewBlackbox/gradlew.bat android/gradlew.bat
          chmod +x android/gradlew
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Flutter SDK path
        shell: bash
        run: |
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build ABI-isolated helper runtimes
        working-directory: android
        run: ./gradlew :engine:assembleArm32Release :engine:assembleArm64Release --no-daemon --stacktrace

      - name: Verify and embed helper runtimes
        shell: bash
        run: |
          set -euo pipefail
          ARM32="$(find build/engine/outputs/apk -type f -name '*arm32*release*.apk' | head -n 1)"
          ARM64="$(find build/engine/outputs/apk -type f -name '*arm64*release*.apk' | head -n 1)"
          test -n "$ARM32" && test -s "$ARM32"
          test -n "$ARM64" && test -s "$ARM64"

          zipinfo -1 "$ARM32" > /tmp/engine32-files.txt
          zipinfo -1 "$ARM64" > /tmp/engine64-files.txt
          grep -q '^lib/armeabi-v7a/libblackbox.so$' /tmp/engine32-files.txt
          ! grep -q '^lib/arm64-v8a/' /tmp/engine32-files.txt
          grep -q '^lib/arm64-v8a/libblackbox.so$' /tmp/engine64-files.txt
          ! grep -q '^lib/armeabi-v7a/' /tmp/engine64-files.txt

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$ARM32"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$ARM64"

          mkdir -p android/app/src/main/assets/engines
          cp "$ARM32" android/app/src/main/assets/engines/appcompat-engine32.apk
          cp "$ARM64" android/app/src/main/assets/engines/appcompat-engine64.apk
          ls -lh android/app/src/main/assets/engines/*.apk

      - name: Build one smart multi-ABI APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --verbose

      - name: Verify final single APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          zipinfo -1 "$APK" > /tmp/appcompat-smart-files.txt

          grep -q '^lib/armeabi-v7a/libflutter.so$' /tmp/appcompat-smart-files.txt
          grep -q '^lib/arm64-v8a/libflutter.so$' /tmp/appcompat-smart-files.txt
          grep -q '^assets/engines/appcompat-engine32.apk$' /tmp/appcompat-smart-files.txt
          grep -q '^assets/engines/appcompat-engine64.apk$' /tmp/appcompat-smart-files.txt

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" AppCompat-smart-v0.10.0.apk
          ls -lh AppCompat-smart-v0.10.0.apk
          sha256sum AppCompat-smart-v0.10.0.apk

      - name: Upload smart APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCompat-smart-v0.10.0-apk
          path: AppCompat-smart-v0.10.0.apk
          if-no-files-found: error
          retention-days: 14
