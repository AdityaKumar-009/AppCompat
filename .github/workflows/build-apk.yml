name: Build AppCompat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Fetch pinned compatibility engine
        run: bash scripts/fetch_engine.sh

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          rm -rf android/gradle android/gradlew android/gradlew.bat
          cp -R third_party/NewBlackbox/gradle android/gradle
          cp third_party/NewBlackbox/gradlew android/gradlew
          cp third_party/NewBlackbox/gradlew.bat android/gradlew.bat
          chmod +x android/gradlew
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Flutter SDK path
        shell: bash
        run: |
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Verify Gradle project
        working-directory: android
        run: ./gradlew :app:tasks --no-daemon --stacktrace

      - name: Build 32-bit and 64-bit compatibility runtimes
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi --verbose

      - name: Verify runtime ABI isolation
        shell: bash
        run: |
          set -euo pipefail
          ARM32="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          ARM64="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$ARM32"
          test -s "$ARM64"

          zipinfo -1 "$ARM32" > /tmp/appcompat-arm32-files.txt
          zipinfo -1 "$ARM64" > /tmp/appcompat-arm64-files.txt

          grep -q '^lib/armeabi-v7a/libflutter.so$' /tmp/appcompat-arm32-files.txt
          grep -q '^lib/armeabi-v7a/libblackbox.so$' /tmp/appcompat-arm32-files.txt
          if grep -q '^lib/arm64-v8a/' /tmp/appcompat-arm32-files.txt; then
            echo "32-bit runtime unexpectedly contains arm64 native libraries" >&2
            exit 1
          fi

          grep -q '^lib/arm64-v8a/libflutter.so$' /tmp/appcompat-arm64-files.txt
          grep -q '^lib/arm64-v8a/libblackbox.so$' /tmp/appcompat-arm64-files.txt
          if grep -q '^lib/armeabi-v7a/' /tmp/appcompat-arm64-files.txt; then
            echo "64-bit runtime unexpectedly contains ARM32 native libraries" >&2
            exit 1
          fi

          cp "$ARM32" AppCompat-32bit.apk
          cp "$ARM64" AppCompat-64bit.apk
          ls -lh AppCompat-32bit.apk AppCompat-64bit.apk
          sha256sum AppCompat-32bit.apk AppCompat-64bit.apk

      - name: Upload 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCompat-32bit-apk
          path: AppCompat-32bit.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCompat-64bit-apk
          path: AppCompat-64bit.apk
          if-no-files-found: error
          retention-days: 14
