name: Build AppCompat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Fetch pinned compatibility engine
        run: bash scripts/fetch_engine.sh

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          rm -rf android/gradle android/gradlew android/gradlew.bat
          cp -R third_party/NewBlackbox/gradle android/gradle
          cp third_party/NewBlackbox/gradlew android/gradlew
          cp third_party/NewBlackbox/gradlew.bat android/gradlew.bat
          chmod +x android/gradlew
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Flutter SDK path
        shell: bash
        run: |
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build ABI-isolated helper runtimes
        working-directory: android
        run: ./gradlew :engine:assembleArm32Release :engine:assembleArm64Release --no-daemon --stacktrace

      - name: Verify and embed helper runtimes
        shell: bash
        run: |
          set -euo pipefail
          ARM32="$(find build/engine/outputs/apk -type f -name '*arm32*release*.apk' | head -n 1)"
          ARM64="$(find build/engine/outputs/apk -type f -name '*arm64*release*.apk' | head -n 1)"
          test -n "$ARM32" && test -s "$ARM32"
          test -n "$ARM64" && test -s "$ARM64"

          zipinfo -1 "$ARM32" > /tmp/engine32-files.txt
          zipinfo -1 "$ARM64" > /tmp/engine64-files.txt
          grep -q '^lib/armeabi-v7a/libblackbox.so$' /tmp/engine32-files.txt
          ! grep -q '^lib/arm64-v8a/' /tmp/engine32-files.txt
          grep -q '^lib/arm64-v8a/libblackbox.so$' /tmp/engine64-files.txt
          ! grep -q '^lib/armeabi-v7a/' /tmp/engine64-files.txt

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$ARM32"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$ARM64"

          mkdir -p android/app/src/main/assets/engines
          cp "$ARM32" android/app/src/main/assets/engines/appcompat-engine32.apk
          cp "$ARM64" android/app/src/main/assets/engines/appcompat-engine64.apk
          ls -lh android/app/src/main/assets/engines/*.apk

      - name: Build one smart multi-ABI APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --verbose

      - name: Verify final single APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          zipinfo -1 "$APK" > /tmp/appcompat-smart-files.txt

          # One user-facing APK contains the Flutter host for both common ARM ABIs
          # plus both signed helper runtimes. The helper chosen at runtime is based
          # on the imported guest APK's native libraries.
          grep -q '^lib/armeabi-v7a/libflutter.so$' /tmp/appcompat-smart-files.txt
          grep -q '^lib/arm64-v8a/libflutter.so$' /tmp/appcompat-smart-files.txt
          grep -q '^assets/engines/appcompat-engine32.apk$' /tmp/appcompat-smart-files.txt
          grep -q '^assets/engines/appcompat-engine64.apk$' /tmp/appcompat-smart-files.txt

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" AppCompat-smart-v0.4.0.apk
          ls -lh AppCompat-smart-v0.4.0.apk
          sha256sum AppCompat-smart-v0.4.0.apk

      - name: Upload smart APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCompat-smart-v0.4.0-apk
          path: AppCompat-smart-v0.4.0.apk
          if-no-files-found: error
          retention-days: 14
