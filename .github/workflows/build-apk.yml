name: Build AppCompat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Fetch pinned compatibility engine
        run: bash scripts/fetch_engine.sh

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          rm -rf android/gradle android/gradlew android/gradlew.bat
          cp -R third_party/NewBlackbox/gradle android/gradle
          cp third_party/NewBlackbox/gradlew android/gradlew
          cp third_party/NewBlackbox/gradlew.bat android/gradlew.bat
          chmod +x android/gradlew
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Flutter SDK path
        shell: bash
        run: |
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Verify Gradle project
        working-directory: android
        run: ./gradlew :app:tasks --no-daemon --stacktrace

      - name: Build installable APK
        run: flutter build apk --release --verbose

      - name: Verify APK exists
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk AppCompat.apk
          ls -lh AppCompat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCompat-apk
          path: AppCompat.apk
          if-no-files-found: error
          retention-days: 14
